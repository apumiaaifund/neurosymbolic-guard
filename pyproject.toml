[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
[project]
name = "neurosymbolic-guard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["z3-solver>=4.12.0", "pyyaml>=6.0.1"]
[project.optional-dependencies]
dev = ["ruff>=0.4.0", "mypy>=1.10.0", "bandit>=1.7.8", "types-PyYAML>=6.0.12"]
[project.scripts]
nsg = "neurosymbolic_guard.cli:main"
[tool.ruff]
line-length = 79
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101"]
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.setuptools]
packages = ["neurosymbolic_guard"]
