name: CI — Safety & Robotics Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi uvicorn websockets httpx2 pydantic pyyaml z3-solver

      - name: Run NeuroSymbolic & Embodied Guard test suite
        run: |
          PYTHONPATH=. pytest -v

      - name: Verify HTML & Embedded JS Integrity
        run: |
          python3 -c '
          import re
          from pathlib import Path
          html = Path("index.html").read_text()
          assert "<!DOCTYPE html>" in html and "</html>" in html, "Broken HTML envelope"
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert len(scripts) == 1, f"Expected 1 script block, got {len(scripts)}"
          Path("/tmp/check.js").write_text(scripts[0])
          '
          node --check /tmp/check.js
