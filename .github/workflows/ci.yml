name: CI — Safety & Robotics Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi uvicorn websockets httpx2 pydantic pyyaml z3-solver

      - name: Run NeuroSymbolic & Embodied Guard test suite
        run: |
          PYTHONPATH=. pytest -v
